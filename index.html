<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alessandro Cusano - Restricted Access</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #EBECEF;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            color: #111;
        }
        .container {
            max-width: 600px;
            width: 100%;
            padding: 40px 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .profile-pic {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 22px;
            margin: 0 0 6px 0;
            font-weight: 700;
        }
        p.subtitle {
            font-size: 15px;
            margin: 0 0 32px 0;
            font-weight: 500;
        }
        .link-button {
            display: flex;
            align-items: center;
            background-color: #FFFFFF;
            text-decoration: none;
            color: #111;
            padding: 8px;
            border-radius: 12px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            transition: transform 0.2s;
        }
        .link-button:hover {
            transform: scale(1.02);
        }
        .link-thumb {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            object-fit: cover;
            background-color: #eee;
        }
        .link-content {
            flex-grow: 1;
            text-align: center;
        }
        .link-title {
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 2px;
        }
        .link-subtitle {
            font-size: 12px;
            color: #666;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        .dots {
            padding: 0 15px;
            color: #999;
            font-weight: bold;
        }
        .social-container {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        /* Stili della schermata di Password */
        #lock-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #EBECEF;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        #lock-screen input {
            padding: 12px;
            border-radius: 24px;
            border: 1px solid #ccc;
            margin-bottom: 12px;
            width: 250px;
            text-align: center;
            font-size: 16px;
            outline: none;
        }
        #lock-screen button {
            padding: 12px 32px;
            border-radius: 24px;
            background-color: #111;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 15px;
        }
        #error-msg {
            color: #d93025;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <!-- Schermata di Accesso (Inglese) -->
    <div id="lock-screen">
        <img src="profilo.jpg" alt="Alessandro" class="profile-pic">
        <h2 style="margin-bottom: 20px; font-size: 18px;">Enter access code</h2>
        <input type="password" id="pass-input" placeholder="Passcode">
        <button onclick="sblocca()">Enter</button>
        <p id="error-msg">Invalid code. Please try again.</p>
    </div>

    <!-- Contenuto Nascosto (Link semplici) -->
    <div class="container" id="main-content" style="display: none;">
        <img src="profilo.jpg" alt="Alessandro Cusano" class="profile-pic">
        <h1>Alessandro Cusano</h1>
        <p class="subtitle">Product Designer | 3D Artist</p>

        <a href="https://www.youtube.com/watch?v=7omXPAX_sn4" class="link-button" target="_blank">
            <img src="thumb-video.jpg" class="link-thumb" alt="Showreel">
            <div class="link-content">
                <div class="link-title">Animation Showreel</div>
            </div>
            <div class="dots">⋮</div>
        </a>

        <a href="portfolio.pdf" class="link-button" target="_blank">
            <img src="thumb-port.jpg" class="link-thumb" alt="Portfolio">
            <div class="link-content">
                <div class="link-title">3D Modelling Portfolio</div>
                <div class="link-subtitle">📄 PDF • Document</div>
            </div>
            <div class="dots">⋮</div>
        </a>

        <a href="cv.pdf" class="link-button" target="_blank">
            <img src="thumb-cv.jpg" class="link-thumb" alt="CV">
            <div class="link-content">
                <div class="link-title">CV</div>
                <div class="link-subtitle">📄 PDF • Document</div>
            </div>
            <div class="dots">⋮</div>
        </a>

        <div class="social-container">
            <a href="mailto:ac.design3D@gmail.com" style="color:#000;">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4C2.9 4 2.01 4.9 2.01 6L2 18C2 19.1 2.9 20 4 20H20C21.1 20 22 19.1 22 18V6C22 4.9 21.1 4 20 4ZM20 8L12 13L4 8V6L12 11L20 6V8Z"/></svg>
            </a>
            <a href="https://www.linkedin.com/in/alessandro-cusano-bb26301b7/" target="_blank" style="color:#000;">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3A2 2 0 0 1 21 5V19A2 2 0 0 1 19 21H5A2 2 0 0 1 3 19V5A2 2 0 0 1 5 3H19M18.5 18.5V13.2A3.26 3.26 0 0 0 15.24 9.94C13.88 9.94 13.2 10.68 12.8 11.23V10.13H10.13V18.5H12.8V13.86C12.8 13.56 12.8 13.25 12.92 13C13.24 12.31 13.84 11.63 14.86 11.63C16.22 11.63 16.74 12.65 16.74 14V18.5H19.5M6.88 8.56A1.68 1.68 0 0 0 8.56 6.88C8.56 5.95 7.81 5.19 6.88 5.19A1.69 1.69 0 0 0 5.19 6.88C5.19 7.81 5.95 8.56 6.88 8.56M8.27 18.5V10.13H5.5V18.5H8.27Z"/></svg>
            </a>
        </div>
    </div>

    <script>
        function sblocca() {
            var pass = document.getElementById("pass-input").value;
            // La password impostata
            if (pass === "1324") {
                document.getElementById("lock-screen").style.display = "none";
                document.getElementById("main-content").style.display = "block";
            } else {
                document.getElementById("error-msg").style.display = "block";
            }
        }
    </script>
</body>
</html>
